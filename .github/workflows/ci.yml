name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: report rebuilds from committed results
        run: if ls results/asr_*.csv >/dev/null 2>&1; then python scripts/report.py > /dev/null; fi
        env:
          PYTHONPATH: .
